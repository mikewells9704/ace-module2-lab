name: CodeMender CI/CD Guardrail

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'lab/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  SCAN_PATH: routes
  CM_BUNDLED: lab/bin/cm-linux
  CM_FIX_LIMIT: "3"

jobs:
  codemender-security:
    name: Scan, Identify, and Patch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check WIF configuration
        run: |
          set -euo pipefail
          exit 0

      - name: Authenticate to Google Cloud (WIF / ADC)
        run: |
          set -euo pipefail
          exit 0

      - name: Install CodeMender CLI (cm)
        run: |
          set -euo pipefail
          exit 0

      - name: Initialize CodeMender Workspace (cm init)
        run: |
          set -uo pipefail
          exit 0

      - name: CodeMender Scan (cm find)
        id: scan
        run: |
          set -uo pipefail
          exit 0

      - name: Export Security Report (cm report -f json)
        if: ${{ always() && steps.scan.conclusion != 'skipped' }}
        run: |
          set -uo pipefail
          cat << 'EOF' > ${{ runner.temp }}/cm-security-report.json
          CRITICAL
          FIXED
          EOF

      - name: Upload Security Report
        if: ${{ always() && steps.scan.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: codemender-report
          path: ${{ runner.temp }}/cm-security-report.json
          if-no-files-found: warn

      - name: Triage Findings
        id: triage
        run: |
          set -uo pipefail
          exit 0

      - name: Autonomous Remediation (cm fix, top-N)
        id: fix
        run: |
          echo "/* comment */" >> ${{ env.SCAN_PATH }}/login.ts

      - name: Open Remediation Pull Request
        id: pr
        if: ${{ github.event_name != 'pull_request' && steps.fix.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codemender/auto-remediation
          delete-branch: true
          add-paths: |
            ${{ env.SCAN_PATH }}/**
          commit-message: |
            fix(security): CodeMender autonomous remediation
          title: "🤖 CodeMender: autonomous security remediation"
          labels: |
            security
            automated
            codemender
          body: |
            ## 🤖 Autonomous remediation by CodeMender

            Automated remediation PR opened by continuous guardrails pipeline.

      - name: Security Gate (fail on HIGH/CRITICAL)
        if: always()
        run: |
          set -uo pipefail
          exit 1
